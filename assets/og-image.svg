<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070d"/>
      <stop offset="0.6" stop-color="#050a14"/>
      <stop offset="1" stop-color="#0a141f"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#001a33"/>
      <stop offset="0.4" stop-color="#0078a8"/>
      <stop offset="0.7" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#caf0f8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Heatmap-style gradient at the bottom -->
  <rect x="0" y="500" width="1200" height="130" fill="url(#ocean)" opacity="0.18"/>

  <!-- Subtle latitude lines (Norwegian feel) -->
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(77,208,225,0.12)" stroke-width="1"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="rgba(77,208,225,0.12)" stroke-width="1"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="rgba(77,208,225,0.12)" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(77,208,225,0.12)" stroke-width="1"/>

  <!-- Whale silhouette -->
  <g transform="translate(720, 320) scale(2.1)">
    <path d="M-100 0 C -60 -45, -10 -55, 50 -42 C 80 -38, 110 -30, 130 -10 C 140 -3, 145 4, 142 12 C 130 8, 110 15, 90 22 C 50 35, 0 32, -40 25 C -70 21, -95 14, -105 5 C -108 2, -107 -2, -100 0 Z"
          fill="#4dd0e1"/>
    <path d="M120 -12 C 134 -22, 148 -22, 158 -12 L 152 4 C 144 -4, 134 -6, 120 -8 Z" fill="#4dd0e1"/>
    <circle cx="100" cy="-22" r="2.5" fill="#050a14"/>
    <path d="M-100 0 C -60 -45, -10 -55, 50 -42 C 60 -36, 35 -38, 10 -30 C -30 -16, -70 -8, -100 0 Z" fill="rgba(255,255,255,0.10)"/>
    <!-- water spray -->
    <path d="M30 -55 Q 32 -75, 22 -85" stroke="#90e0ef" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M40 -55 Q 50 -78, 40 -88" stroke="#90e0ef" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="80" y="180" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#ffffff">
    Coexisting
  </text>
  <text x="80" y="260" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#4dd0e1">
    with Whales
  </text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="-apple-system, sans-serif" font-size="24" fill="#a8b9d0" font-weight="400">
    Cetacean density and vessel strike risk
  </text>
  <text x="80" y="350" font-family="-apple-system, sans-serif" font-size="24" fill="#a8b9d0" font-weight="400">
    in Norwegian and surrounding waters.
  </text>

  <!-- Stats line -->
  <text x="80" y="460" font-family="-apple-system, sans-serif" font-size="18" fill="#4dd0e1" font-weight="600" letter-spacing="1">
    GBIF · EMODNET · MARINE REGIONS · NATURAL EARTH
  </text>
  <text x="80" y="490" font-family="-apple-system, sans-serif" font-size="14" fill="#8b9bb1">
    25 cetacean species · Vanderlaan-Taggart 2007 lethality curve · open data
  </text>

  <!-- Bottom URL -->
  <text x="80" y="585" font-family="-apple-system, sans-serif" font-size="16" fill="#8b9bb1">
    coexisting-with-whales.no
  </text>
</svg>
